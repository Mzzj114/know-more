upstream django {
    server unix:///tmp/uwsgi/uwsgi.sock;
}

server {
    listen      80;
    server_name promptforgood.org www.promptforgood.org;
    return      301 https://promptforgood.org$request_uri;
}

server {
    listen      443 ssl;
    server_name www.promptforgood.org;
    ssl_certificate     /etc/ssl/know-more/promptforgood.org.pem;
    ssl_certificate_key /etc/ssl/know-more/promptforgood.org.key;
    return      301 https://promptforgood.org$request_uri;
}

server {
    listen      443 ssl;
    server_name promptforgood.org;
    charset     utf-8;

    ssl_certificate /etc/ssl/know-more/promptforgood.org.pem;
    ssl_certificate_key /etc/ssl/know-more/promptforgood.org.key;

    # Hide nginx version from error pages
    server_tokens off;

    # Max upload size
    client_max_body_size 75M;

    # Deny access to hidden files and directories (.env, .git, .htaccess, etc.)
    location ~ /\. { deny all; }

    # Drop common non-Django script extensions used by scanners/webshells
    location ~* \.(php\d?|phtml|asp|aspx|jsp|cgi|pl|sh)$ { return 444; }

    # Drop common CMS/admin scanner targets
    location ~* ^/(wp-admin|wp-includes|wp-content|wp-json|phpmyadmin|adminer) { return 444; }

    # Django static files
    location /static {
        alias /app/staticfiles;

        # CDN
        expires 30d;
        add_header Cache-Control "public";
    }

    # Proxy all non-static requests to Django
    location / {
        uwsgi_pass  django;
        include     /etc/nginx/uwsgi_params;
    }

    # Sitemap - handled by Django
    location = /sitemap.xml {
        uwsgi_pass  django;
        include     /etc/nginx/uwsgi_params;
    }

    location = /robots.txt {
        alias /app/staticfiles/robots.txt;
    }

    # Redirect root favicon request to static files for old browsers
    location = /favicon.ico {
        return 301 /static/favicon/favicon.ico;
    }
}
